  .chip.vivo i{width:8px;height:8px;border-radius:50%;background:#2e7d32;animation:late2 1.2s infinite}
  @keyframes late2{50%{opacity:.25}}
  .cargaV{display:none;font-size:.8rem;font-weight:700;color:var(--sub)} .cargando .cargaV{display:inline}
  .saber.dato .sbDato{font-size:1.1rem;line-height:1.35}
  .sabLista{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  .sabLista .saber{margin:0}
  .sbIntro{color:var(--sub);font-weight:600;margin:4px 0 12px}
  .btnSaber{background:#fffbea!important;border-color:#f3dd8b!important}
  .btnSaber .ico{animation:brilla 2.4s ease-in-out infinite}
  .saber .otro{margin-left:auto;font:inherit;font-weight:800;border:2px solid #e8cf73;background:#fff;border-radius:14px;padding:6px 12px;cursor:pointer;color:#7a5a00}
  /* ---- Escenas animadas ---- */
  .gEsc{margin:8px auto 10px;max-width:340px;border-radius:16px;overflow:hidden;border:2px solid var(--line);line-height:0;background:#fff}
  .gEsc .esc{width:100%;height:auto;display:block}
  .gCaja{max-height:94vh;overflow:auto}
  /* ---- Íconos con vida ---- */
  .tiles .luz .ico{animation:flota 2.6s ease-in-out infinite}
  .tarea2 .ic .ico{animation:flota 2.2s ease-in-out infinite}
  .cult .ch .ico{animation:flota 3s ease-in-out infinite}
  @keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .mesc.sig{animation:late 1.8s ease-in-out infinite}
  @keyframes late{0%,100%{box-shadow:0 0 0 0 rgba(227,164,0,.0)}50%{box-shadow:0 0 0 5px rgba(227,164,0,.25)}}
  @media (prefers-reduced-motion:reduce){.tiles .luz .ico,.tarea2 .ic .ico,.cult .ch .ico,.mesc.sig{animation:none}}
  /* ---- Celular: agricultor en el centro de la barra, sin tapar nada ---- */
  @media (max-width:800px){
    aside{z-index:1000}
    .menu button:nth-child(2){margin-right:44px} .menu button:nth-child(3){margin-left:44px}
    .menu button{font-size:.72rem;padding:8px 2px;margin:6px 2px;min-width:0;line-height:1.15}
    html,body{overflow-x:hidden}
    .menu{min-width:0}
    .abueloM,.abueloM:not(.habla){position:fixed;left:calc(50% - 38px);right:auto;bottom:calc(30px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;overflow:hidden;background:#fff;border:3px solid var(--verdeM);box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:1100;cursor:pointer}
    .abueloM .escena,.abueloM:not(.habla) .escena{width:124px;margin:-10px 0 0 -27px;display:block}
    .abueloM.habla{border-color:var(--amarillo);animation:late 1s infinite}
    .abueloM .globo{position:fixed;left:16px;right:16px;bottom:calc(118px + env(safe-area-inset-bottom));width:auto;margin:0;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.15);z-index:1101}
    .abueloM .globo:after{left:50%;right:auto;margin-left:-8px;bottom:-9px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
    .abueloM:not(.habla) .globo{display:none}
    main{padding-bottom:130px}
    .cabeza .paisajeM svg{height:22px!important}
    .tiles .sem{min-height:150px}
    .tarea2 .tt{font-size:1.2rem}
    .gTxt{font-size:1.12rem}
    .gPaso{padding:12px;min-height:0}
  }

  /* ---- LETRA GRANDE (agricultores con poca vista) ---- */
  html{font-size:18px} body{font-size:1.08rem;line-height:1.45}
  aside{width:236px} main{margin-left:236px}
  .menu button{font-size:1.08rem}
  .nota,.cult .ck,.chip,.cargaV,.foto figcaption,.marca small,.saber.dato .sbH small,.sbIntro{font-size:.92rem}
  footer{font-size:.88rem;line-height:1.5}
  .gK{font-size:.95rem} .gTxt{font-size:1.3rem}
  .tiles .sem .t{font-size:1.02rem} .tiles .sem .a{font-size:1.08rem} .tiles .sem .v{font-size:1.6rem}
  .cult .cv{font-size:1.1rem} .cult .cn{font-size:1.02rem}
  .sbX{font-size:1.08rem} .saber.dato .sbDato{font-size:1.15rem}
  .leaflet-tooltip.aqui{font-size:16px}
  .globo{font-size:1.05rem}
  @media (max-width:800px){
    html{font-size:17px}
    aside{width:100%} main{margin-left:0}
    .menu button{font-size:.8rem}
    .tiles .sem .t{font-size:.95rem} .tiles .sem .v{font-size:1.35rem} .tiles .sem .a{font-size:1rem}
    .tiles .sem{padding:12px 10px}
    .tarea2 .tt{font-size:1.25rem}
    .gTxt{font-size:1.18rem}
    .mesc .nm{font-size:.92rem}
    #zona{font-size:1.1rem}
  }
  @media (max-width:360px){ html{font-size:16px} .menu button{font-size:.76rem} .mesc .nm{font-size:.82rem} }

  .pregIdi{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:#fff8e1;border:2px solid #f3dd8b;border-radius:18px;padding:12px 14px;margin:8px 0}
  .pregIdi .pqTxt{flex:1;min-width:180px;font-size:1.1rem;color:#5a4300}
  .pregIdi .pqBtns{display:flex;flex-wrap:wrap;gap:8px}
  .pregIdi button{font:inherit;font-weight:800;border-radius:14px;padding:9px 14px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--txt)}
  .pregIdi button.si{background:var(--verdeO);color:#fff;border-color:var(--verdeO)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} .tiles .sem,.tiles .sem>div{min-width:0} .tiles .sem .t,.tiles .sem .v,.tiles .sem .a,.tarea2 .tt,.gTit{overflow-wrap:anywhere;hyphens:auto}
  .menu button{overflow-wrap:anywhere}
  /* ---- Letra pequeña aún más grande ---- */
  .nota,.cult .ck,.chip,.cargaV,.foto figcaption,.marca small,.saber.dato .sbH small,.sbIntro,.senamhi span{font-size:1.02rem}
  .cult .ck{letter-spacing:.02em} .chip{padding:5px 12px}
  footer{font-size:.98rem}
  .gK{font-size:1.05rem}
  .tiles .sem .t{font-size:1.12rem}
  .mesc .nm{font-size:1.05rem}
  h2{font-size:1.15rem}
  @media (max-width:800px){
    .tiles .sem .t{font-size:1.05rem}
    .menu button{font-size:.86rem}
    .mesc .nm{font-size:1rem}
    .nota,.cult .ck,.chip{font-size:1rem}
  }
  @media (max-width:360px){ .menu button{font-size:.8rem} .mesc .nm{font-size:.9rem} .tiles .sem .t{font-size:.98rem} }
</style>

 // --- Guías paso a paso ---
 "Cubra el suelo con rastrojo o paja.": ["Allpata ch'aqchuwan utaq ichhuwan qataykuy.", "Uraqi ch'illiwampi jan ukax ch'ijimp ch'uqt'am."], "Así la tierra guarda la humedad.": ["Chhaynapi allpa hump'iyta waqaychan.", "Ukhamat uraqix ch'aranchat imi."],
 "Riegue al pie de la planta o por goteo, no inundando todo el surco.": ["Yurapa chakinpi utaq sut'uchiwan qarpay, ama llapan wachuta yakuwan hunt'achispa.", "Alin kayupan jan ukax ch'aqiwamp qarpam, jan taqpach qhiwa umamp phuqhantas."],
 "Si puede, junte agua en un reservorio o tanque tapado cuando le toque su turno de riego.": ["Atispaqa, qarpay mit'aykipi yakuta qatasqa qucha utaq tanquepi huñuy.", "Atisaxa, qarpañ mit'amanx uma ch'uqt'at qutaru jan ukax tanquer imt'am."],
 "Limpie su canal o acequia y tape las fugas.": ["Yarqhaykita pichay, t'uquchakusqankunatapas wisq'ay.", "Larq'ama q'umachtam, p'iyanakapsa jist'antam."], "Riegue al pie de la planta, sin inundar todo el surco.": ["Yurapa chakinpi qarpay, ama llapan wachuta hunt'achispa.", "Alin kayupan qarpam, jan taqpach qhiwa phuqhantas."],
 "Organícese con su comité de riego para guardar agua en reservorios.": ["Qarpay comiteykiwan huñunakuy, qucha ukhupi yakuta waqaychanaykipaq.", "Qarpañ comitemamp tantachasim, qutanakan uma imañataki."],
 "Cuide sus qochas y bofedales: son el depósito natural de agua.": ["Quchaykikunata, bofedalkunatapas qhawariy: paykunam yakupa waqaychana.", "Qutanakama, bofedalanakamsa uñjam: jupanakaw uma imañ utapaxa."],
 "Haga zanjas de infiltración en las laderas para que la lluvia entre a la tierra.": ["Q'asakunapi yaku yaykunan ñankunata allay, para allpaman yaykunanpaq.", "Qhuchunakan uma mantañ p'iyanak allsum, jallux uraqir mantañapataki."],
 "Junte agua de lluvia en qochas o reservorios para la época seca.": ["Para yakuta quchakunapi huñuy, ch'aki pachapaq.", "Jallu uma qutanakar imt'am, wañu pachataki."],
 "Con sol y viento el agua se evapora.": ["Intiwan wayrawanqa yaku chinkapun.", "Intimp thayampix umax chhaqtiwa."], "Al pie de la planta y con el suelo cubierto se pierde mucho menos.": ["Yurapa chakinpi, allpa qatasqa kaqtinqa aswan pisitam chinkan.", "Alin kayupan, uraqi ch'uqt'atäkipansti juk'akiw chhaqtixa."],
 "En los canales de tierra se pierde mucha agua por filtración.": ["Allpa yarqhakunapiqa ancha yakum allpaman chinkapun.", "Uraqi larq'anakanx walja umaw uraqir chhaqtixa."], "Un canal limpio y sin fugas lleva más agua a su chacra.": ["Pichasqa, mana t'uquyuq yarqhaqa aswan yakutam chakraykiman apan.", "Q'uma, jan p'iyan larq'ax juk'amp umaw yapumar apani."],
 "El agua que entra a la tierra alimenta manantiales y bofedales que dan agua en la época seca.": ["Allpaman yaykuq yakuqa pukyukunata, bofedalkunatapas mikhuchin, ch'aki pachapi yakuta qunankupaq.", "Uraqir mantir umax juturinakaru, bofedalanakaru manq'ayi, wañu pachan uma churañapataki."],
 "Riegue temprano en la mañana o al atardecer.": ["Tutamanta utaq ch'isiyaqta qarpay.", "Alwata jan ukax jayp'u qarpam."], "Si riega por surcos o aspersión, evite el mediodía: con sol fuerte se evapora más agua.": ["Wachuwan utaq aspersionwan qarpaspaqa, ama chawpi p'unchawpi qarpaychu: sinchi intiwanqa aswan yakum chinkan.", "Qhiwanakamp jan ukax aspersionamp qarpasmax, jan chika uru qarpamti: ch'aman intimpix juk'amp umaw chhaqtixa."],
 "Toque la tierra antes de regar: si está húmeda, todavía no riegue.": ["Manaraq qarpachkaspa allpata llamiy: hump'iyuq kaqtinqa, amaraq qarpaychu.", "Janïr qarpkasin uraqi llamkt'am: ch'arankchi ukhax, janïr qarpamti."],
 "Con calor, el suelo y las plantas pierden más agua.": ["Ruphaywanqa allpapas yurakunapas aswan yakutam chinkachinku.", "Junt'umpix uraqis alinakas juk'amp umaw chhaqtayapxi."], "En las horas frescas se evapora menos.": ["Chiri pachakunapiqa pisitam chinkan.", "Thaya horanakanx juk'akiw chhaqtixa."],
 "Use sombrero de ala ancha y ropa de manga larga.": ["Hatun raprayuq sombrerota, suni makiyuq p'achatapas churakuy.", "Jach'a lap'ani philuma, jach'a amparani isimsa uchasim."],
 "Póngase bloqueador en la cara, las manos y los labios, y repítalo cada 2 horas.": ["Uyaykiman, makiykiman, siriykiman bloqueadorta llimp'ikuy, sapa 2 horata kutipay.", "Ajanumaru, amparamaru, lakamaru bloqueador sañchim, sapa 2 horas wasitat lurañamawa."],
 "Tome agua seguido.": ["Sapa kuti yakuta ukyay.", "Sapa kuti uma umt'am."], "De 10 de la mañana a 4 de la tarde, trabaje a la sombra o descanse.": ["Tutamanta 10 horamanta ch'isi 4 horakama, llanthupi llamk'ay utaq samakuy.", "Alwa 10 horat jayp'u 4 horkama, ch'iwin irnaqam jan ukax samarasim."],
 "En el Perú el sol tiene radiación ultravioleta muy alta.": ["Perú suyupiqa intipa ultravioleta k'anchaynin ancha sinchim.", "Perú markanx intin ultravioleta qhanapax wali ch'amaniwa."], "Con el tiempo daña la piel, aunque no se sienta.": ["Pacha pasaqtinqa qarata k'irin, mana musyakuqtinpas.", "Pacha sarasax lip'ichi usuchi, jan amuyaskchi ukasa."],
 "Abríguese bien en la madrugada y en la noche, que es cuando más hiela.": ["Paqarinpi tutapipas allinta p'istukuy, chay pachakunapim aswan qasan.", "Willjtan arumampix wali isimp ch'uqt'asim, ukapachaw juk'amp juyphixa."],
 "Use crema hidratante en la cara, las manos y los labios: el frío reseca y agrieta la piel.": ["Uyaykiman, makiykiman, siriykiman hump'ichiq cremata llimp'ikuy: chiriqa qarata ch'akichin, qhasuntaq.", "Ajanumaru, amparamaru, lakamaru ch'arantir crema sañchim: thayax lip'ichi waña-yi, jaljtayiraki."],
 "De día use sombrero y bloqueador: en la altura el sol quema aunque haga frío.": ["P'unchawpi sombrerota, bloqueadortapas churakuy: hanaq pachapiqa inti ruphachin chiri kaqtinpas.", "Urunx philuma, bloqueador uchasim: alaxpachanx intix nakhantiwa thayäkchi ukasa."],
 "El frío seco reseca la piel y en la altura el sol es muy fuerte.": ["Ch'aki chiriqa qarata ch'akichin, hanaq pachapitaq inti ancha sinchi.", "Waña thayax lip'ichi wañayi, alaxpachanx intix wali ch'amaniwa."],
 "En la época de frío, en su puesto de salud vacunan contra la gripe (influenza) y el neumococo, sobre todo a niños pequeños y mayores.": ["Chiri pachapiqa hampina wasiykipi gripemanta (influenza), neumococomantapas vacunanku, astawanqa huch'uy wawakunata, machulakunatapas.", "Thaya pachanx qullañ utaman gripe (influenza), neumococo contra vacunapxi, juk'ampis jisk'a wawanakaru, achachilanakarusa."],
 "Limpie acequias y drenes para que el agua no se quede empozada en su chacra.": ["Yarqhakunata, drenkunatapas pichay, yaku chakraykipi ama qhipakunanpaq.", "Larq'anaka, drenanaka q'umachtam, umax yapuman jan qhiparañapataki."],
 "Con lluvia fuerte, aléjese del río y de las quebradas: pueden bajar huaicos.": ["Sinchi paraqtinqa mayumanta, q'asakunamantapas karunchakuy: lluqllakuna uraykamunmanmi.", "Ch'aman jallunx jawirat, qhuchunakatsa jayanchasim: lluqllanakaw saraqanispa."],
 "Aproveche: guarde parte de esta agua en qochas o reservorios.": ["Kay yakuta quchakunapi huk partinta waqaychay.", "Aka umat mä chiqa qutanakar imt'am."], "Las lluvias fuertes activan las quebradas y pueden traer huaicos.": ["Sinchi parakunaqa q'asakunata kawsarichin, lluqllakunatam apamunman.", "Ch'aman jallunakax qhuchunak sartayi, lluqllanakaw apanispa."],
 "Un buen drenaje protege su cultivo, y el agua guardada le servirá en la época seca.": ["Allin drenajeqa tarpusqaykita amachan, waqaychasqa yakutaq ch'aki pachapi yanapasunki.", "Wali drenajex satanakam jark'i, imt'at umasti wañu pachan yanapätam."],
 "Riegue uno o dos días antes de una helada: la tierra húmeda guarda más calor del día.": ["Qasa manaraq chayamuchkaqtin huk iskay p'unchawña qarpay: hump'iyuq allpaqa p'unchawpa q'uñinta aswan waqaychan.", "Juyphi janïr purinkipan mä pä uru nayraqat qarpam: ch'arankchi uraqix uru junt'u juk'amp imi."],
 "Tape las plantas pequeñas antes de que oscurezca y destápelas en la mañana.": ["Huch'uy yurakunata manaraq tutayachkaqtin qatay, paqarintaq kichay.", "Jisk'a alinakax janïr ch'amakt'kipan ch'uqt'am, alwasti jist'arañamawa."],
 "Guarde a sus alpacas y llamas en cobertizos, sobre todo a las crías y a las madres preñadas.": ["Paqochaykikunata, llamaykikunatapas cobertizokunapi waqaychay, astawanqa uñakunata, chichu mamakunatapas.", "Allpachunakama, qawranakamsa cobertizonakan imt'am, juk'ampis uñanakaru, usur taykanakarusa."],
 "Las heladas llegan en noches despejadas, cuando la tierra suelta su calor.": ["Qasakunaqa ch'uya tutakunapim chayamun, allpa q'uñinta kacharichkaqtin.", "Juyphinakax qhana arumanakanw puri, uraqix junt'up antutkipana."], "La tierra húmeda y las coberturas lo guardan mejor.": ["Hump'iyuq allpa, qatanakunapas aswan allinta waqaychanku.", "Ch'arankchi uraqi, ch'uqt'añanakasa juk'amp walt'ayiw imapxi."],
 "Toque la tierra antes de regar para no gastar agua de más.": ["Manaraq qarpachkaspa allpata llamiy, yakuta yanqa ama usuchinaykipaq.", "Janïr qarpkasin uraqi llamkt'am, umax inamay jan tukuñapataki."], "Aproveche para limpiar acequias antes del verano.": ["Puquy pacha manaraq chayamuchkaqtin yarqhakunata pichay.", "Jallu pacha janïr purinkipan larq'anak q'umachtam."],

 "Necesita un invierno fresco para florecer bien.": ["Allinta t'ikananpaqqa chiri ch'aki pachata munan.", "Wali panqarañapatakix thaya awti pacha munaraki."],
 "Ojo con El Niño: en 2024 un invierno caliente hizo caer mucho la cosecha de aceituna en el sur.": ["El Niñowan cuidakuy: 2024 watapi q'uñi ch'aki pacha uraq suyupi aceituna hallmayta ancha pisiyachirqan.", "El Niño ukamp amuyasim: 2024 maran junt'u awti pachax aynacha tuqin aceituna apthapi wali juk'achäna."],
 "No deje que le falte agua cuando florezca: es cuando más la necesita.": ["T'ikachkaqtin ama yaku pisichunchu: chay pachapim aswan munan.", "Panqarkipan jan uma pist'ayamti: ukapachaw juk'amp munaraki."], "Clima normal para el olivo.": ["Olivopaq sapa kutin hina pacha.", "Olivotakix walikiw pachaxa."],

// Saludo del agricultor (se arma con piezas)
const TR_HOY = {"llovió normal":["sapa kutin hina paran","walikiw jallu purini"],"no sabemos bien la lluvia":["manaraq allintachu parata yachanchik","janïraw jallu walpun yatktanti"],"llovió mucho":["ancha paran","walja jallu purini"],"llovió poco":["pisillata paran","juk'a jallukiw purini"]};
const TR_CAL = {"hace mucho calor":["ancha ruphaymi","wali junt'uwa"],"hace más calor de lo normal":["sapa kutinmanta aswan ruphaymi","sapa kutit sipans juk'amp junt'uwa"],"la temperatura está normal":["q'uñi chiriqa sapa kutin hinam","junt'u thayax walikiwa"],"hace más frío de lo normal":["sapa kutinmanta aswan chirimi","sapa kutit sipans juk'amp thayawa"]};
const TR_CON = {"revise sus acequias y cuide su piel del sol":["yarqhaykita qhawariy, qarakitataq intimanta amachay","larq'ama uñakipam, lip'ichimsa intit jark'am"],
 "riegue temprano para no perder agua y cuide su piel del sol":["tutamanta qarpay yaku ama chinkananpaq, qarakitataq intimanta amachay","alwata qarpam uma jan chhaqtañapataki, lip'ichimsa intit jark'am"],
 "riegue temprano y cuide su piel del sol":["tutamanta qarpay, qarakitataq intimanta amachay","alwata qarpam, lip'ichimsa intit jark'am"],
 "revise sus acequias y cuide sus plantas en la noche":["yarqhaykita qhawariy, tutapitaq yurakunaykita amachay","larq'ama uñakipam, arumanx alinakama jark'am"],
 "cuide el agua y sus plantas en la noche":["yakuta waqaychay, tutapitaq yurakunaykita amachay","uma imt'am, arumanx alinakama jark'am"],
 "cuide sus plantas en la noche":["tutapi yurakunaykita amachay","arumanx alinakama jark'am"],"revise sus acequias":["yarqhaykita qhawariy","larq'ama uñakipam"],"cuide el agua":["yakuta waqaychay","uma imt'am"],"riegue como siempre":["sapa kutin hina qarpay","sapa kuti qarpam"]};
function trSaludo(s, i) { const m = s.match(/^Hoy en su zona (.+?) y (hace .+?|la temperatura .+?): (.+)\.$/); if (!m || !TR_HOY[m[1]] || !TR_CAL[m[2]] || !TR_CON[m[3]]) return null;
  return (i ? "Jichhürux markamana " : "Kunan llaqtaykipi ") + TR_HOY[m[1]][i] + ", " + TR_CAL[m[2]][i] + ": " + TR_CON[m[3]][i] + "."; }
const iL = () => lang === "qu" ? 0 : lang === "ay" ? 1 : -1;
function trOracion(o) { const i = iL(); if (i < 0) return o; const s = o.trim().replace(/\u00a0/g, " "); if (!s) return o; o = o.replace(/\u00a0/g, " ");
  if (TR[s]) return o.replace(s, TR[s][i]);
  const sa = trSaludo(s, i); if (sa) return o.replace(s, sa);
  for (const [re, r] of TRP) if (re.test(s)) return o.replace(s, s.replace(re, r[i]));
  const sp = s.replace(/[.:]$/, "");   // mismo texto sin el punto final

  const une = arr => arr.length > 1 ? arr.slice(0, -1).join(", ") + (ln() === "en" ? " and " : " y ") + arr.at(-1) : arr[0];
  const frase = lluviosos.length ? (ln() === "en" ? `It rains most in ${une(lluviosos.map(i => t.meses[i]))}. The rest of the year it rains little.`
                                                  : `Llueve más en ${une(lluviosos.map(i => t.meses[i]))}. El resto del año llueve poco.`) : "";
  voz.cal = {d:frase, b:une(lluviosos.map(i => t.meses[i]))};
  const gota = on => `<svg viewBox="0 0 20 26" class="gt${on ? "" : " off"}"><path d="M10 1 C10 1 2 11 2 16.5 A8 8 0 0 0 18 16.5 C18 11 10 1 10 1Z"/></svg>`;

    papa:{n:"Papa", nec:"Las heladas fuertes (más de 2 grados bajo cero) dañan sus hojas. La falta de agua cuando forma las papas baja la cosecha.", calor:"Si falta lluvia, riegue cuando se estén formando las papas.", lluvia:"Llueve bien: buen momento para sembrar. Esté atento a las heladas.", helada:"Hubo heladas: si ya sembró, riegue antes y tape las plantitas en la noche.", normal:"Clima normal para la papa."},
    oregano:{n:"Orégano", nec:"Usa menos agua que la alfalfa o el maíz, pero sin agua su producción baja mucho.", calor:"Con calor y poca lluvia, riegue a tiempo para que no baje la cosecha.", normal:"Clima normal para el orégano."},
    pasto:{n:"Pastos y bofedales", nec:"Dependen de la lluvia del verano. Alimentan a alpacas y llamas.", calor:"Si llueve poco, no cargue el pasto con demasiados animales.", lluvia:"Llueve bien: cuide los bofedales y no los sobrecargue.", helada:"Con heladas crece poco pasto: guarde heno en un lugar seco y techado para alimentar a sus animales.", normal:"Clima normal para los pastos."}}},
 en:{titulo:"Your crops and this year's weather", aviso:"Guidance only. Check with an agronomist or your local agriculture office.",
  necesita:"What it needs", esteAnio:"This year", pronto:"Coming soon: sowing and harvest calendar.",
  c:{olivo:{n:"Olive", nec:"Needs a cool winter to flower well.", calor:"Watch out for El Niño: in 2024 a warm winter caused a large drop in the olive harvest in southern Peru. Do not let it lack water at flowering: that is when it needs it most.", normal:"Normal weather for olives."},
    alfalfa:{n:"Alfalfa", nec:"Needs plenty of water for good cuts.", calor:"In strong heat alfalfa yields less per cut. Extra water does not fix it: irrigate as usual, in cool hours, without waterlogging.", normal:"Normal weather for alfalfa."},
    palta:{n:"Avocado", nec:"Needs steady irrigation and is sensitive to frost.", calor:"Strong heat at flowering can make flowers and small fruit drop: water well before hot days.", normal:"Normal weather for avocado."},
    vid:{n:"Grape", nec:"Tolerates drought and heat well, but bunches burn in direct sun.", calor:"In strong heat, do not remove the leaves that shade the bunches.", normal:"Normal weather for grapes."},
    papa:{n:"Potato", nec:"Hard frost (below minus 2 degrees) damages its leaves. Lack of water while tubers form lowers the harvest.", calor:"If rain is short, irrigate while tubers are forming.", lluvia:"Good rain: a good time to plant. Watch for frost.", helada:"There was frost: if you already planted, irrigate beforehand and cover young plants at night.", normal:"Normal weather for potatoes."},
    oregano:{n:"Oregano", nec:"Uses less water than alfalfa or maize, but without water its yield drops a lot.", calor:"With heat and little rain, irrigate on time so the harvest does not drop.", normal:"Normal weather for oregano."},
    pasto:{n:"Pastures and wetlands", nec:"Depend on summer rain. They feed alpacas and llamas.", calor:"If rain is short, do not overload pastures with animals.", lluvia:"Good rain: protect the wetlands and do not overload them.", helada:"With frost little grass grows: store hay in a dry, roofed place to feed your animals.", normal:"Normal weather for pastures."}}}
};
function cultivosHTML(z, mL, mT, mV, mH) {
  const C = CULT[ln()], helada = mH && mH.c !== "verde", calor = (mT.c === "rojo" || mT.c === "amarillo") && !mH, llueve = mL.s === tx().lMucha;
  return `<h2>${C.titulo}</h2><div class="cults">${CULT_ZONA[z].map(k => { const c = C.c[k];
    const este = helada && c.helada ? c.helada : llueve && c.lluvia ? c.lluvia : calor && c.calor ? c.calor : c.normal;
    const col = (calor || llueve || helada) ? "amarillo" : "verde";
    voz["cu_" + k] = {d:`${c.n}. ${este}`, b:c.n};
    const est = helada ? "helada" : llueve ? "lluvia" : calor ? "calor" : "normal";
    return `<button class="cult" data-voz="cu_${k}" style="border-top-color:${HEX[col]}"><div class="ch">${ico(k === "vid" ? "uva" : k, 54)}<b>${c.n}</b><span class="vz">${ico("parlante", 34)}</span></div>
      <div class="cEsc">${escenaCultivo(k, est)}</div>
      <div class="ck">${C.esteAnio}</div><div class="cv">${este}</div><div class="ck">${C.necesita}</div><div class="cn">${c.nec}</div></button>`; }).join("")}</div>
    <p class="nota">${C.aviso} ${C.pronto}</p>`;
}

const semaforo = (id, titulo, m, nota) => { voz[id] = {d:m.d || `${m.s}. ${m.a}.`, b:m.b || m.a};
  return `<button class="sem" data-voz="${id}"><div class="luz" style="border-color:${HEX[m.c]}">${ico(m.ic, 40)}</div>
    <div><div class="t">${titulo}</div><div class="v">${m.s}</div><div class="a">${m.a}</div>${nota ? `<div class="nota">${nota}</div>` : ""}</div>
    <span class="vz">${ico("parlante", 34)}</span></button>`; };

// Mapa real (Leaflet + OpenStreetMap) si se puede; si no, esquema
// Color de cada zona en el mapa: lo más serio entre lluvia, calor y heladas
const ORDEN_C = {rojo:4, amarillo:3, azul:2, verde:1, gris:0};
function estadoZona(z) { const Z = D.zona[z], mH = mHelada(Z.heladas), ms = [mLluvia(Z.hoy), mH || mTemp(Z.hoy)];
  if (mH) ms.push(mH); let m = ms[0]; ms.forEach(x => { if (ORDEN_C[x.c] > ORDEN_C[m.c]) m = x; }); return m; }
function mapaEsquema(zSel) {
  const W = 340, H = 300, x = lon => (lon + 71.6) / 1.5 * (W - 40) + 20, y = lat => (lat + 15.75) / -2.05 * (H - 50) + 45;
  return `<svg viewBox="0 0 ${W} ${H}">${D.zonas.map(z => { const c = D.zona[z].coord, m = estadoZona(z), X = x(c[1]), Y = y(c[0]), d = X > W * .55;
    return `<g data-z="${z}" style="cursor:pointer"><circle cx="${X}" cy="${Y}" r="${z === zSel ? 15 : 11}" fill="${HEX[m.c]}" stroke="${z === zSel ? "#1f2a22" : "#fff"}" stroke-width="3"/>
    <text x="${z.startsWith("Altiplano") ? X : d ? X - 18 : X + 18}" y="${z.startsWith("Altiplano") ? Y + 28 : Y + 5}" font-size="13" font-family="Nunito,sans-serif" text-anchor="${z.startsWith("Altiplano") ? "middle" : d ? "end" : "start"}" font-weight="${z === zSel ? 800 : 600}">${zn(z).split(" (")[0]}</text></g>`; }).join("")}
    ${(() => { const c = D.zona[zSel].coord, w = 132, X = Math.min(Math.max(x(c[1]), w / 2 + 4), W - w / 2 - 4), Y = y(c[0]);
      return `<g><rect x="${X - w / 2}" y="${Y - 52}" width="${w}" height="28" rx="14" fill="#1f5a2e"/><path d="M${x(c[1]) - 7} ${Y - 25} L${x(c[1])} ${Y - 17} L${x(c[1]) + 7} ${Y - 25}Z" fill="#1f5a2e"/>
      <text x="${X}" y="${Y - 33}" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Nunito,sans-serif">${tx().aqui}</text></g>`; })()}
    <text x="12" y="${H - 12}" font-size="12" opacity=".5" font-family="Nunito,sans-serif">${ln() === "en" ? "Pacific Ocean" : "Océano Pacífico"}</text></svg>`;
}
function dibujarMapa(zSel) {
  const el = document.getElementById("mapa"); if (!el) return;
  const esquema = () => { mapaOk = false; el.innerHTML = mapaEsquema(zSel);
    el.querySelectorAll("[data-z]").forEach(g => g.onclick = () => { sel.value = g.dataset.z; cambiar(); }); };
  if (!mapaOk || typeof window.L === "undefined" || !window.L.map) return esquema();
  try {
    if (mapaL) { mapaL.remove(); mapaL = null; }
    const c = D.zona[zSel].coord;
    // Mapa FIJO de Moquegua: no se arrastra (así no estorba al bajar en el celular); solo se acerca o aleja
    mapaL = window.L.map(el, {attributionControl:true, dragging:false, scrollWheelZoom:false, touchZoom:true, doubleClickZoom:true, boxZoom:false, keyboard:false, tap:false, zoomSnap:.25});
    const lim = window.L.latLngBounds(D.zonas.map(z => D.zona[z].coord)).pad(.18);
    mapaL.fitBounds(lim); mapaL.setMinZoom(mapaL.getZoom()); mapaL.setMaxBounds(lim.pad(.3));
    mapaL.on("zoomend", () => { if (mapaL.getZoom() <= mapaL.getMinZoom() + .01) mapaL.fitBounds(lim); });   // al alejar, vuelve a verse toda la región
    const capa = window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:13, attribution:"© OpenStreetMap"});
    let err = 0; capa.on("tileerror", () => { if (++err === 3) { mapaL.remove(); mapaL = null; esquema(); } });
    capa.addTo(mapaL);
    D.zonas.forEach(z => { const k = D.zona[z].coord, m = estadoZona(z), sel_ = z === zSel, nom = zn(z).split(" (")[0];
      window.L.circleMarker([k[0], k[1]], {radius:sel_ ? 16 : 12, color:sel_ ? "#1f2a22" : "#fff", weight:3, fillColor:HEX[m.c], fillOpacity:.95})
        .addTo(mapaL).bindTooltip(sel_ ? `<b>${tx().aqui}</b><br>${nom}` : `${nom}<br><small>${m.s}</small>`, {permanent:sel_, direction:"top", offset:[0, -12], className:sel_ ? "aqui" : ""}).on("click", () => { sel.value = z; cambiar(); }); });
    if (window.miPos) window.L.circleMarker(window.miPos, {radius:8, color:"#fff", weight:3, fillColor:"#1f6fbf", fillOpacity:1}).addTo(mapaL);
    const ley = window.L.control({position:"bottomleft"});
    ley.onAdd = () => { const d = document.createElement("div"); d.className = "leyMapa"; const en = ln() === "en";
      d.innerHTML = [["rojo", en ? "Careful" : "Cuidado"], ["amarillo", en ? "Watch" : "Atento"], ["verde", en ? "Normal" : "Normal"]].map(([c, t]) => `<span><i style="background:${HEX[c]}"></i>${t}</span>`).join(""); return d; };
    ley.addTo(mapaL);
  } catch(e) { esquema(); }
}

function irA(s) { seccion = s; document.querySelectorAll("section").forEach(x => x.classList.toggle("on", x.id === s));
  document.querySelectorAll("#menu button").forEach(b => b.classList.toggle("on", b.dataset.s === s)); window.scrollTo(0, 0);
  if (s === "inicio") setTimeout(() => mapaL && mapaL.invalidateSize(), 50); }

function pintar() {
  voz = {};
  const t = tx(), zPrev = sel.value || D.zonas[0];
  document.documentElement.lang = ln();
  sel.innerHTML = ""; D.zonas.forEach(z => sel.add(new Option(innerWidth <= 800 ? znCorto(z) : zn(z), z))); sel.value = zPrev;
  const ids = ["inicio", "chacra", "cultivos", "info"];
  document.getElementById("menu").innerHTML = t.menu.map((m, i) => `<button data-s="${ids[i]}" class="${ids[i] === seccion ? "on" : ""}">${ico(m[0], 34)}${m[1]}</button>`).join("");
  document.querySelectorAll("#menu button").forEach(b => b.onclick = () => irA(b.dataset.s));
  document.getElementById("avisoIdioma").innerHTML = (lang === "qu" || lang === "ay") ? `<div class="aviso"><span class="icIdi"></span> ${QA[lang].prep}</div>` : preguntaIdioma(sel.value);
  document.querySelectorAll(".icIdi").forEach(e => e.innerHTML = ico("idioma", 30));

  const z = sel.value, Z = D.zona[z], a = Z.hoy, v = Z.verano, pm = Z.proximo[0];
  const mH = mHelada(Z.heladas);
  const mL = mLluvia(a), mT = mTemp(a), mV = mVerano(Z), tt = Z.tend_temp, subio = tt.ultimos10 - tt.decada80;
  const secos = Z.parecidos.filter(p => p.categoria === "seco").map(p => p.verano);
  const yRec = (secos.length ? secos : Z.parecidos.map(p => p.verano)).slice(-2).join(ln() === "en" ? " and " : " y ");
  voz.todo = resumen(mL, mH ? {c:"verde"} : mT, mV, v.verano);
  if (mH && Z.heladas.noches_helada > 0) voz.todo.d += " " + mH.d;
  if (!document.getElementById("abuelo").classList.contains("habla")) animar(false);
  voz.desde = {d:subio >= .5 ? t.dD.mas : t.dD.igual, b:subio >= .5 ? t.bD.mas : t.bD.igual};

  // INICIO
  DATOS_DIA = datosDelDia(Z, t);
  document.getElementById("inicio").innerHTML = `
    <h2>${t.hoy}</h2>
    <div class="dos"><div class="tiles">
      ${semaforo("s1", t.lluvia, mL)}
      ${mH ? semaforo("s2", t.hel, mH, t.hNota(Z.heladas.normal_mediana)) : semaforo("s2", t.temp, mT)}
      ${semaforo("s3", t.verano(v.verano), mV, t.recuerdo(yRec))}
      <button class="sem" data-voz="desde"><div class="luz" style="border-color:${subio >= .5 ? HEX.rojo : HEX.verde}">${ico("arena", 40)}</div>
        <div><div class="t">${t.antes}</div><div class="v">${subio >= .5 ? t.masCalor80 : t.igual80}</div><div class="nota">${sg(subio)} °C (1981-2025)</div></div><span class="vz">${ico("parlante", 34)}</span></button>
    </div><div><div id="mapa" aria-label="${t.mapa}"></div></div></div>
    <div class="saber dato" id="datoDia">${datoHTML()}</div>
    <button class="btnSaberes enInicio" onclick="contarSaber()"><span class="icSab"></span><span class="txSab"></span></button>
    <a class="senamhi" href="https://www.senamhi.gob.pe/?p=pronostico-meteorologico" target="_blank" rel="noopener">${ico("nube", 44)}
      <span><b>${ln() === "en" ? "Will it rain tomorrow?" : xq("llueve", "¿Llueve mañana?")}</b><br>${ln() === "en" ? "See the daily forecast from SENAMHI, Peru's weather service" : xq("llueveSub", "Vea el pronóstico de cada día del SENAMHI")}</span><span class="flecha">›</span></a>`;

  cargarVivo(z);
  setTimeout(precargar, 300);
  document.querySelectorAll(".icSab").forEach(e => e.innerHTML = ico("foco", 30));
  document.querySelectorAll(".txSab").forEach(e => e.textContent = ln() === "en" ? "Andean knowledge" : xq("saber", "Saberes ancestrales"));
  // MI CHACRA
  const claves = [];
  const hayHelada = !!mH;  // zona de heladas: no se usan consejos de calor (dato de temperatura provisional)
  if (mH && Z.heladas.noches_helada > 0) claves.push("heladas", "pielFrio");
  if (mL.s === t.lMucha) claves.push("acequias"); else if (mL.s === t.lPoca) claves.push("guardar");
  if (mV.c !== "verde") claves.push("guardar");
  if ((mT.c === "rojo" || mT.c === "amarillo") && !hayHelada) claves.push("riegue", "piel");
  if (!claves.length) claves.push("normal");
  const keys = [...new Set(claves)].slice(0, 4), G = GUIAS[ln()];
  const tareas = keys.map(k => G[k].t);
  const dif = pm.temp_esperada - pm.normal;
  voz.mes = ln() === "en" ? {d:`In ${t.meses[pm.mes - 1]} it will be about ${fmt(pm.temp_esperada, 0)} degrees, ${dif > .5 ? "warmer than normal" : "as usual"}.`, b:`${fmt(pm.temp_esperada, 0)} °C`}
                          : {d:`En ${t.meses[pm.mes - 1]} hará unos ${fmt(pm.temp_esperada, 0)} grados, ${dif > .5 ? "más calor de lo normal" : "como siempre"}.`, b:`${fmt(pm.temp_esperada, 0)} °C`};
  voz.tareas = {d:tareas.join(". ") + ".", b:tareas[0]};
  const maxN = Math.max(...Z.lluvia_normal.map(m => m[2]), 1);
  document.getElementById("chacra").innerHTML = `<div class="col2"><div>
    <h2>${t.hacer}</h2>
    <div class="tareas">${keys.map(k => `<button class="tarea2" onclick="abrirGuia('${k}')"><span class="ic">${ico(G[k].ic, 52)}</span>
      <span class="tt">${xq("guiaT", {})[k] || G[k].t}</span><span class="como">${xq("como", G.como)} ${ico("play", 24)}</span></button>`).join("")}</div>
    </div><div>
    <h2>${t.proxMes}: ${t.meses[pm.mes - 1]}</h2>
    <div class="grande" data-voz="mes">
      <div class="sub">${t.hara}</div>
      <div class="num">${ico("termometro", 52)} ${fmt(pm.temp_esperada)} °C</div>
      <div class="sub">${t.entre(fmt(pm.temp_min), fmt(pm.temp_max))}</div>
      <div class="chips"><div>${t.lonormal}<b>${fmt(pm.normal)} °C</b></div><div>${t.porNino}<b>${sg(pm.temp_esperada - pm.normal)} °C</b></div></div>
      <div class="nota">${t.mesNota}</div>
    </div>
    <h2>${t.cuando}</h2>
    ${calendarioLluvia(Z, pm.mes, t)}
    </div></div>
`;
  document.getElementById("cultivos").innerHTML = cultivosHTML(z, mL, mT, mV, mH);

  // INFORMACIÓN
  document.getElementById("info").innerHTML = `<div class="info2">
    <div class="info"><h2 style="margin-top:0">${t.qEs}</h2><p>${t.qEsT}</p></div>
    <figure class="foto"><img src="foto_chacra.jpg" alt="${ln() === "en" ? "A farm in Moquegua" : "Una chacra en Moquegua"}" onerror="this.parentElement.remove()">
      <figcaption>${ln() === "en" ? "Photo: Team TROYA, Moquegua" : "Foto: equipo TROYA, Moquegua"}</figcaption></figure>
    <div class="info"><h2 style="margin-top:0">${t.colores}</h2><p>${t.colT}</p></div>
    <div class="info"><h2 style="margin-top:0">${t.noSabe}</h2><p>${t.noSabeT}</p></div>
    <div class="info equipo"><img class="logoT logoG" src="${LOGO_T}" alt="Logo de TROYA"><div><h2 style="margin-top:0">${t.equipo}</h2><p>${t.equipoT}</p></div></div>
    <div class="info"><h2 style="margin-top:0">${ln() === "en" ? "Where the advice comes from" : "De dónde salen los consejos"}</h2><p>${ln() === "en"
      ? "From FAO (frost protection), MINSA and SENAMHI (sun and cold), MIDAGRI and Fondo Sierra Azul (qochas, shelters), the National Water Authority (canals) and university research on each crop. The full list is on the technical page."
      : "De la FAO (protección contra heladas), el MINSA y el SENAMHI (sol y frío), el MIDAGRI y el Fondo Sierra Azul (qochas, cobertizos), la Autoridad Nacional del Agua (canales) e investigaciones universitarias de cada cultivo. La lista completa está en la página técnica."}</p></div></div>
    <p style="margin:18px 4px">${ico("lupa", 26)} <a href="tecnico.html">${t.tec}</a></p>
    <footer>${ln() === "en" ? "Data: NASA POWER (MERRA-2), NASA GPM IMERG (via Giovanni), NOAA CPC El Niño indices. Map: © OpenStreetMap contributors. Code, icons and illustrations written with the help of an AI assistant (Claude) and reviewed by Team TROYA. Not an official forecasting service."
      : "Datos: NASA POWER (MERRA-2), NASA GPM IMERG (vía Giovanni), índices de El Niño de NOAA CPC. Mapa: © colaboradores de OpenStreetMap. Código, íconos e ilustraciones hechos con ayuda de un asistente de IA (Claude) y revisados por el equipo TROYA. No es un servicio oficial de pronóstico."}</footer>`;

  dibujarMapa(z);
  activarTraduccion();   // quechua / aimara: traduce todo lo que quedó en castellano
}
function cambiar() { try { localStorage.setItem("zona", sel.value); } catch(e) {} pintar(); }
sel.onchange = cambiar;
function ubicar(manual) {
  const en = ln() === "en";
  const MSJ = {1: en ? "Location permission is blocked. Tap the lock next to the web address, allow Location and try again." : "El permiso de ubicación está bloqueado. Toque el candado junto a la dirección web, permita Ubicación y vuelva a intentar.",
    2: en ? "Turn on your phone's location (GPS) and try again." : "Active la ubicación (GPS) de su celular y vuelva a intentar.",
    3: en ? "The GPS took too long. Go outdoors or try again." : "El GPS demoró mucho. Salga a un lugar abierto o vuelva a intentar.",
    lejos: en ? "You seem to be far from Moquegua. Choose your area from the list." : "Parece que usted está lejos de Moquegua. Elija su zona en la lista.",
    no: en ? "This device cannot share its location. Choose your area from the list." : "Este equipo no puede dar su ubicación. Elija su zona en la lista."};
  const avisar = k => { if (manual) { const el = document.getElementById("avisoIdioma"); el.innerHTML = `<div class="aviso">${MSJ[k] || MSJ[2]}</div>`; if (typeof trDOM === "function") trDOM(el); } };
  if (!navigator.geolocation || !window.isSecureContext) return avisar("no");
  const btn = document.getElementById("btnUbic"); if (manual && btn) btn.classList.add("buscando");
  const listo = () => btn && btn.classList.remove("buscando");
  const ok = p => { listo();
    const la = p.coords.latitude, lo = p.coords.longitude;
    let best = D.zonas[0], dm = 1e9; D.zonas.forEach(z => { const c = D.zona[z].coord, d = (c[0] - la) ** 2 + (c[1] - lo) ** 2; if (d < dm) { dm = d; best = z; } });
    if (dm > 1.5 ** 2) { window.miPos = null; return avisar("lejos"); }   // lejos de Moquegua (más de ~150 km): que elija su zona a mano
    window.miPos = [la, lo]; document.getElementById("avisoIdioma").querySelector(".aviso")?.remove();
    if (sel.value !== best) { sel.value = best; cambiar(); } else dibujarMapa(best); };
  // 1.º intento rápido (red/wifi); si falla por tiempo o no hay señal, 2.º intento con GPS de alta precisión
  try { navigator.geolocation.getCurrentPosition(ok, e => {
      if (e.code === 1) { listo(); return avisar(1); }
      navigator.geolocation.getCurrentPosition(ok, e2 => { listo(); avisar(e2.code); }, {enableHighAccuracy:true, timeout:25000, maximumAge:0});
    }, {enableHighAccuracy:false, timeout:12000, maximumAge:600000});
  } catch(e) { listo(); avisar("no"); }
}
document.getElementById("btnUbic").onclick = () => ubicar(true);
let guardada = null; try { guardada = localStorage.getItem("zona"); } catch(e) {}
if (guardada && D.zonas.includes(guardada)) { sel.add(new Option(guardada, guardada)); sel.value = guardada; }
pintar();
// Ubicación automática: la primera vez la pide; si ya dio permiso antes, se actualiza sola en cada visita
if (!guardada) ubicar(false);
else try { navigator.permissions && navigator.permissions.query({name:"geolocation"}).then(r => { if (r.state === "granted") ubicar(false); }).catch(() => {}); } catch(e) {}
</script>
